name: "Get the merged pull request information"
description: "Get information about the pull request merged into the default branch"
author: "yu-iskw"

branding:
  icon: "code"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token"
    required: true

outputs:
  pull-request-number:
    description: "The pull request number of the pull request created by the composite GitHub Action"
    value: ${{ steps.get_pr_info.outputs.pull_request_number }}
  pull-request-creator:
    description: "The GitHub account name who created the pull request"
    value: ${{ steps.get_pr_info.outputs.pull_request_creator }}
  pull-request-title:
    description: "The title of the pull request"
    value: ${{ steps.get_pr_info.outputs.pull_request_title }}
  pull-request-branch:
    description: "The branch of the pull request"
    value: ${{ steps.get_pr_info.outputs.pull_request_branch }}

runs:
  using: "composite"
  steps:
    - name: "Checkout the repository"
      uses: actions/checkout@v3

    - name: "Get commit hash of the merged pull request"
      id: get_commit_hash
      shell: bash
      run: |
        echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: "Fetch merged pull request information"
      id: get_pr_info
      uses: actions/github-script@v6
      with:
        github-token: ${{ inputs.github-token }}
        debug: true
        script: |
          const commitHash = "${{ steps.get_commit_hash.outputs.commit_hash }}";
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          console.log(`Fetching pull request for commit hash: ${commitHash}`);

          // First try: Use GraphQL API to find PR associated with commit
          async function findPrWithGraphQL() {
            try {
              const query = `
                query findPrByCommit($owner: String!, $repo: String!, $commitOid: GitObjectID!) {
                  repository(owner: $owner, name: $repo) {
                    commit: object(oid: $commitOid) {
                      ... on Commit {
                        associatedPullRequests(first: 1) {
                          nodes {
                            number
                            title
                            author {
                              login
                            }
                            headRefName
                            merged
                          }
                        }
                      }
                    }
                  }
                }
              `;
              
              const variables = {
                owner,
                repo,
                commitOid: commitHash
              };
              
              const result = await github.graphql(query, variables);
              
              const prs = result.repository.commit?.associatedPullRequests?.nodes || [];
              // Filter for merged PRs only
              const mergedPRs = prs.filter(pr => pr.merged);
              
              if (mergedPRs.length > 0) {
                const pr = mergedPRs[0];
                return {
                  pull_request_number: pr.number,
                  pull_request_creator: pr.author.login,
                  pull_request_title: pr.title,
                  pull_request_branch: pr.headRefName
                };
              }
              return null;
            } catch (error) {
              console.log(`GraphQL query error: ${error.message}`);
              return null;
            }
          }

          // Second try: Use REST API to list PRs and find matching merge commit
          async function findPrFromMergeCommit() {
            try {
              // Get commit details to see if it's a merge commit
              const { data: commitData } = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: commitHash
              });
              
              // If it's a merge commit, extract PR number from message if possible
              if (commitData.parents.length > 1) { 
                const mergeMessage = commitData.message;
                const prMatch = mergeMessage.match(/Merge pull request #(\d+)/);
                if (prMatch && prMatch[1]) {
                  const prNumber = parseInt(prMatch[1]);
                  
                  // Get PR details
                  const { data: pr } = await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: prNumber
                  });
                  
                  return {
                    pull_request_number: pr.number,
                    pull_request_creator: pr.user.login,
                    pull_request_title: pr.title,
                    pull_request_branch: pr.head.ref
                  };
                }
              }
              return null;
            } catch (error) {
              console.log(`REST API error: ${error.message}`);
              return null;
            }
          }

          // Third try: Look at recent PRs and check if they contain the commit
          async function findPrByRecentMerges() {
            try {
              // Get recently closed PRs
              const { data: recentPRs } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'closed',
                sort: 'updated',
                direction: 'desc',
                per_page: 10
              });
              
              // Check each merged PR
              for (const pr of recentPRs.filter(p => p.merged_at)) {
                // Get commits in this PR
                const { data: commits } = await github.rest.pulls.listCommits({
                  owner,
                  repo,
                  pull_number: pr.number
                });
                
                // Check if our commit is in this PR
                if (commits.some(c => c.sha === commitHash)) {
                  return {
                    pull_request_number: pr.number,
                    pull_request_creator: pr.user.login,
                    pull_request_title: pr.title,
                    pull_request_branch: pr.head.ref
                  };
                }
              }
              return null;
            } catch (error) {
              console.log(`Recent PR search error: ${error.message}`);
              return null;
            }
          }

          // Try all methods
          let prInfo = await findPrWithGraphQL();
          if (!prInfo) {
            console.log("GraphQL method didn't find a PR, trying merge commit method...");
            prInfo = await findPrFromMergeCommit();
          }
          if (!prInfo) {
            console.log("Merge commit method didn't find a PR, trying recent merge method...");
            prInfo = await findPrByRecentMerges();
          }

          // Provide fallback if no PR is found
          if (!prInfo) {
            console.log("No merged pull request found, using fallback values");
            
            // If we have a hardcoded PR number from context (e.g. for this case 564)
            // You could set this via inputs or get it from your screenshot
            const knownPrNumber = context.payload.pull_request?.number;
            
            if (knownPrNumber) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo, 
                  pull_number: knownPrNumber
                });
                prInfo = {
                  pull_request_number: pr.number,
                  pull_request_creator: pr.user.login,
                  pull_request_title: pr.title,
                  pull_request_branch: pr.head.ref
                };
              } catch (e) {
                console.log(`Failed to get known PR ${knownPrNumber}: ${e.message}`);
              }
            }
            
            // Ultimate fallback
            if (!prInfo) {
              prInfo = {
                pull_request_number: "0",
                pull_request_creator: "unknown",
                pull_request_title: `Direct commit to ${context.ref.split('/').pop()}`,
                pull_request_branch: context.ref.split('/').pop()
              };
            }
          }

          console.log(`Pull request details:`);
          console.log(`- Number: ${prInfo.pull_request_number}`);
          console.log(`- Creator: ${prInfo.pull_request_creator}`);
          console.log(`- Title: ${prInfo.pull_request_title}`);
          console.log(`- Branch: ${prInfo.pull_request_branch}`);

          return prInfo;

